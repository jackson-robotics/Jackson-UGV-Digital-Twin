ekf_filter_node:
  ros__parameters:

    use_sim_time: true
    frequency: 30.0
    sensor_timeout: 0.2
    reset_on_time_jump: true
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    publish_tf: true
    print_diagnostics: true

    # Odometría obtenida de las ruedas virtuales
    odom0: /wheel/odom

    # x, y, yaw, vx y velocidad angular z
    odom0_config: [
      true,  true,  false,
      false, false, true,
      true,  false, false,
      false, false, true,
      false, false, false
    ]

    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    # IMU virtual calibrada
    imu0: /imu/data_filtered

    # Utilizar solamente velocidad angular Z
    imu0_config: [
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, true,
      false, false, false
    ]

    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 10
