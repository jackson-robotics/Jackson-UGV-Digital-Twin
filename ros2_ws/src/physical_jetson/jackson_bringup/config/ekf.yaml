ekf_filter_node:
  ros__parameters:

    frequency: 30.0
    sensor_timeout: 0.20
    two_d_mode: true

    transform_time_offset: 0.0
    transform_timeout: 0.0

    print_diagnostics: true
    debug: false

    publish_tf: true
    publish_acceleration: false

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Encoders: utilizar únicamente velocidad lineal X
    odom0: /wheel/odom

    odom0_config:
      [
        false, false, false,
        false, false, false,
        true,  true, false,
        false, false, false,
        false, false, false
      ]

    odom0_queue_size: 10
    odom0_nodelay: false
    odom0_differential: false
    odom0_relative: false

    # IMU: utilizar únicamente velocidad angular Z
    imu0: /imu/data

    imu0_config:
      [
        false, false, false,
        false, false, false,
        false, false, false,
        false, false, true,
        false, false, false
      ]

    imu0_queue_size: 50
    imu0_nodelay: false
    imu0_differential: false
    imu0_relative: false

    # No fusionamos aceleraciones
    imu0_remove_gravitational_acceleration: false

    dynamic_process_noise_covariance: false
